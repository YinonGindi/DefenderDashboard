    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Loading overlay ── */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(13,17,23,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-shield {
            width: 80px; height: 84px;
            filter: drop-shadow(0 0 24px rgba(0,120,212,0.6));
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        .loading-text {
            font-size: 16px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 1px;
        }
        .loading-bar-track {
            width: 200px; height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        .loading-bar-fill {
            height: 100%; width: 30%;
            background: linear-gradient(90deg, #0078d4, #58c8ff);
            border-radius: 3px;
            animation: slide 1.2s ease-in-out infinite;
        }
        @keyframes slide {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(450%); }
        }

        /* ── Header ── */
        header {
            height: 72px;
            padding: 0 36px;
            display: flex;
            align-items: center;
            gap: 16px;
            background: #0d1117;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .header-shield { width: 48px; height: 50px; filter: drop-shadow(0 0 12px rgba(0,120,212,0.5)); }
        .header-title h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 0;
            margin: 0 auto;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 8px 4px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .stat-item {
            text-align: center;
            padding: 0 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .stat-item:last-child { border-right: none; }
        .stat-item .stat-val { font-size: 24px; font-weight: 700; }
        .stat-item .stat-val.blue { color: #58a6ff; }
        .stat-item .stat-val.green { color: #3fb950; }
        .stat-item .stat-val.orange { color: #d29922; }
        .stat-item .stat-label { font-size: 11px; color: #6b7b8d; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-arrow { color: #6b7b8d; font-size: 14px; padding: 0 4px; }

        .header-time {
            font-size: 13px;
            color: #c9d1d9;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 0;
            cursor: pointer;
            position: relative;
        }
        .header-time select {
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            border: none;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 13px;
            padding: 8px 32px 8px 14px;
            cursor: pointer;
            outline: none;
        }
        .header-time select option {
            background: #161b22;
            color: #c9d1d9;
        }
        .header-time::after {
            content: '▾';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #6b7b8d;
            font-size: 12px;
        }
        .header-gear {
            position: relative;
            width: 32px; height: 32px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            display: flex; align-items: center; justify-content: center;
            color: #8b949e; cursor: pointer; font-size: 18px;
        }
        .gear-menu {
            display: none;
            position: absolute;
            top: 40px; right: 0;
            background: #161b22;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 12px 16px;
            min-width: 180px;
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .gear-menu.open { display: block; }
        .gear-menu label {
            display: block;
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .gear-menu select {
            width: 100%;
            background: rgba(255,255,255,0.06);
            color: #e6edf3;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 13px;
            cursor: pointer;
        }
        .refresh-indicator {
            font-size: 11px;
            color: #3fb950;
            margin-top: 8px;
            text-align: center;
        }

        /* ── Main canvas ── */
        .canvas-wrap {
            position: relative;
            height: calc(100vh - 72px);
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .canvas-wrap.visible {
            opacity: 1;
        }
        header {
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        header.visible {
            opacity: 1;
        }

        /* Annotation labels */
        .anno {
            position: absolute;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            z-index: 10;
        }
        .anno-left { color: #3fb950; top: 24px; left: 25%; }
        .anno-left::after { content: ' ▼'; font-size: 10px; }
        .anno-right { color: #d29922; top: 24px; right: 25%; }
        .anno-right::before { content: '▲ '; font-size: 10px; }

        /* Full-width SVG for sankey flows */
        #sankey {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* ── Left labels ── */
        .left-label {
            position: absolute;
            z-index: 10;
            text-align: right;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .left-label .ll-icon { font-size: 16px; }
        .left-label .ll-name { font-size: 15px; font-weight: 600; color: #c9d1d9; }
        .left-label .ll-val { font-size: 15px; font-weight: 400; color: #8b949e; }
        .left-label[data-url] { cursor: pointer; }
        .left-label[data-url]:hover .ll-name { color: #58a6ff; text-decoration: underline; }

        /* Left colored bars */
        .left-bar {
            position: absolute;
            z-index: 5;
            width: 5px;
            border-radius: 3px;
        }

        /* ── Right labels ── */
        .right-label {
            position: absolute;
            z-index: 10;
            text-align: left;
        }
        .right-label .rl-name { font-size: 15px; font-weight: 700; color: #c9d1d9; }
        .right-label .rl-inc { font-size: 14px; font-weight: 700; }
        .right-label .rl-alerts { font-size: 12px; color: #6b7b8d; }

        /* Right colored bars */
        .right-bar {
            position: absolute;
            z-index: 5;
            width: 5px;
            border-radius: 3px;
        }

        /* ── Center shield ── */
        .center-shield {
            position: absolute;
            z-index: 20;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
        }
        .shield-glow {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,120,212,0.35) 0%, rgba(0,180,255,0.12) 40%, transparent 70%);
            animation: shieldPulse 3s ease-in-out infinite;
        }
        @keyframes shieldPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.06); opacity: 0.75; }
        }
        .shield-svg {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            width: 120px; height: 126px;
            filter: drop-shadow(0 0 30px rgba(56,182,255,0.4));
        }
    </style>
</head>

    { name: 'Cloud Apps',       value: 0,   icon: '☁',  color: '#6e4fa0', url: 'https://security.microsoft.com/cloudapps/settings?tabid=appConnectors' },
    { name: 'Sentinel',  value: 0,   icon: '<img src="https://ms-security.gallerycdn.vsassets.io/extensions/ms-security/ms-sentinel/2.0.2/1775192808731/Microsoft.VisualStudio.Services.Icons.Default" style="width:18px;height:18px;vertical-align:middle;border-radius:3px;">', color: '#2e9ced', unit: 'GB' },
    { name: 'AI Agent',  value: 0,   icon: '🤖', color: '#9b59b6', url: 'https://security.microsoft.com/ai-agents-inventory' },
];
let targets = [
    { name: 'High',          incidents: 0, alerts: 0, color: '#e74856' },
    { name: 'Medium',        incidents: 0, alerts: 0, color: '#ff8c00' },
    { name: 'Low',           incidents: 0, alerts: 0, color: '#d29922' },
    { name: 'Informational', incidents: 0, alerts: 0, color: '#2e9ced' },
];

// ── Fetch live data from backend API ──
function showLoading() {
    const o = document.getElementById('loading-overlay');
    if (o) o.classList.remove('hidden');
}
function hideLoading() {
    const o = document.getElementById('loading-overlay');
    if (o) o.classList.add('hidden');
}

async function fetchDashboard(timeframe, silent = false) {
    if (!silent) showLoading();
    let data;
    try {
        const res = await fetch(`/api/dashboard?timeframe=${timeframe}`);
        data = await res.json();
    } catch (err) {
        console.warn('API unreachable, showing zeros:', err.message);
        data = {
            sources: { identities: 0, devices: 0, email: 0, cloudApps: 0, sentinelGB: 0, aiAgents: 0 },
            header:  { totalAlerts: 0, totalIncidents: 0, openIncidents: 0 },
            stats:   { noiseReduction: 0, correlation: 0 },
            incidents: {
                high: { incidents: 0, alerts: 0 }, medium: { incidents: 0, alerts: 0 },
                low: { incidents: 0, alerts: 0 }, informational: { incidents: 0, alerts: 0 },
            },
        };
    }

    // Update left-side sources
    sources[0].value = data.sources.identities;
    sources[1].value = data.sources.devices;
    sources[2].value = data.sources.email;
    sources[3].value = data.sources.cloudApps;
    sources[4].value = data.sources.sentinelGB;
    sources[5].value = data.sources.aiAgents;

    // Update right-side severity targets
    targets[0].incidents = data.incidents.high.incidents;
    targets[0].alerts    = data.incidents.high.alerts;
    targets[1].incidents = data.incidents.medium.incidents;
    targets[1].alerts    = data.incidents.medium.alerts;
    targets[2].incidents = data.incidents.low.incidents;
    targets[2].alerts    = data.incidents.low.alerts;
    targets[3].incidents = data.incidents.informational.incidents;
    targets[3].alerts    = data.incidents.informational.alerts;

    // Update header stats
    document.querySelector('.stat-val.blue').textContent  = data.header.totalAlerts;
    document.querySelector('.stat-val.green').textContent  = data.header.totalIncidents;
    document.querySelector('.stat-val.orange').textContent = data.header.openIncidents;

    // Update annotations
    document.getElementById('anno-noise').textContent = data.stats.noiseReduction + '% noise reduction';
    document.getElementById('anno-corr').textContent  = data.stats.correlation + '% correlation';

    // Hide loading overlay and reveal dashboard
    if (!silent) {
        hideLoading();
        document.querySelector('header').classList.add('visible');
        document.getElementById('canvas').classList.add('visible');
    }

    layout();
}

// Timeframe dropdown → re-fetch
document.getElementById('timeframe').addEventListener('change', (e) => {
    fetchDashboard(e.target.value);
});

// ── Gear menu toggle ──
const gearBtn = document.getElementById('gear-btn');
const gearMenu = document.getElementById('gear-menu');
gearBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    gearMenu.classList.toggle('open');
});
document.addEventListener('click', () => gearMenu.classList.remove('open'));
gearMenu.addEventListener('click', (e) => e.stopPropagation());

// ── Auto refresh ──
let autoRefreshTimer = null;
const refreshSelect = document.getElementById('auto-refresh');
const refreshIndicator = document.getElementById('refresh-indicator');

function startAutoRefresh() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    const seconds = parseInt(refreshSelect.value);
    if (seconds === 0) {
        refreshIndicator.textContent = '⟳ Auto refresh: Off';
        return;
    }
    const label = seconds < 60 ? seconds + ' sec' : (seconds / 60) + ' min';
    refreshIndicator.textContent = '⟳ Auto refresh: ' + label;
    autoRefreshTimer = setInterval(() => {
        fetchDashboard(document.getElementById('timeframe').value, true);
    }, seconds * 1000);
}

refreshSelect.addEventListener('change', startAutoRefresh);
startAutoRefresh();

// Initial load
fetchDashboard(document.getElementById('timeframe').value);

const NS = 'http://www.w3.org/2000/svg';
const canvas = document.getElementById('canvas');
const svg    = document.getElementById('sankey');

function layout() {
    const W = canvas.clientWidth;
    const H = canvas.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.innerHTML = '';

    // Remove old overlays
    canvas.querySelectorAll('.left-label,.left-bar,.right-label,.right-bar').forEach(e => e.remove());

    const LEFT_X = 230;
    const RIGHT_X = W - 230;
    const MID_X  = W / 2;
    const MID_W  = 110;

    const PAD_TOP = 60;
    const PAD_BOT = 30;
    const usableH = H - PAD_TOP - PAD_BOT;
    const totalSrcVal = sources.reduce((s, d) => s + d.value, 0) || 1;
    const GAP_SRC = 14;
    const activeSrc = sources.filter(s => s.value > 0);
    const srcScale = (usableH - GAP_SRC * Math.max(activeSrc.length - 1, 0)) / totalSrcVal;

    const MIN_BAND_H = 32;
    let srcBands = [];
    let sy = PAD_TOP;
    for (const s of sources) {
        const h = s.value > 0 ? Math.max(s.value * srcScale, MIN_BAND_H) : 0;
        srcBands.push({ ...s, y: sy, h });
        if (h > 0) sy += h + GAP_SRC;
    }

    const totalTgtVal = targets.reduce((s, d) => s + d.alerts, 0) || 1;
    const GAP_TGT = 14;
    const activeTgt = targets.filter(t => t.alerts > 0);
    const tgtScale = (usableH - GAP_TGT * Math.max(activeTgt.length - 1, 0)) / totalTgtVal;
    let tgtBands = [];
    let ty = PAD_TOP;
    for (const t of targets) {
        const h = t.alerts > 0 ? Math.max(t.alerts * tgtScale, MIN_BAND_H) : 0;
        tgtBands.push({ ...t, y: ty, h });
        if (h > 0) ty += h + GAP_TGT;
    }

    const centerTop = H / 2 - 100;
    const centerBotFull = H / 2 + 100;
    const cTotalH = centerBotFull - centerTop;

    const defs = document.createElementNS(NS, 'defs');
    svg.appendChild(defs);

    let cLeftY = centerTop;
    const cLeftSlots = srcBands.map(b => {
        const ch = (b.value / totalSrcVal) * cTotalH;
        const slot = { y: cLeftY, h: ch };
        cLeftY += ch;
        return slot;
    });

    let cRightY = centerTop;
    const cRightSlots = tgtBands.map(b => {
        const ch = (b.alerts / totalTgtVal) * cTotalH;
        const slot = { y: cRightY, h: ch };
        cRightY += ch;
        return slot;
    });

    // ── Draw left flows ──
    srcBands.forEach((band, i) => {
        if (band.h <= 0) return;
        const cSlot = cLeftSlots[i];

        const grad = document.createElementNS(NS, 'linearGradient');
        grad.id = `lg${i}`;
        grad.setAttribute('x1', '0%'); grad.setAttribute('x2', '100%');
        const s1 = document.createElementNS(NS, 'stop');
        s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', band.color); s1.setAttribute('stop-opacity', '0.75');
        const s2 = document.createElementNS(NS, 'stop');
        s2.setAttribute('offset', '100%'); s2.setAttribute('stop-color', band.color); s2.setAttribute('stop-opacity', '0.25');
        grad.append(s1, s2); defs.appendChild(grad);

        const x0 = LEFT_X + 6;
        const x1 = MID_X - MID_W;
        const cpx = x0 + (x1 - x0) * 0.5;

        const d = `
            M ${x0},${band.y}
            C ${cpx},${band.y} ${cpx},${cSlot.y} ${x1},${cSlot.y}
            L ${x1},${cSlot.y + cSlot.h}
            C ${cpx},${cSlot.y + cSlot.h} ${cpx},${band.y + band.h} ${x0},${band.y + band.h}
            Z`;
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', `url(#lg${i})`);
        svg.appendChild(path);

        const motionD = `M ${x0},${band.y + band.h / 2} C ${cpx},${band.y + band.h / 2} ${cpx},${cSlot.y + cSlot.h / 2} ${x1},${cSlot.y + cSlot.h / 2}`;
        addParticles(svg, defs, `lm${i}`, motionD, 7, band.color);

        const bar = document.createElement('div');
        bar.className = 'left-bar';
        bar.style.cssText = `left:${LEFT_X}px;top:${band.y}px;height:${band.h}px;background:${band.color};`;
        canvas.appendChild(bar);

        const lbl = document.createElement('div');
        lbl.className = 'left-label';
        lbl.style.cssText = `right:${W - LEFT_X + 12}px;top:${band.y + band.h / 2 - 18}px;`;
        lbl.innerHTML = `<span class="ll-icon">${band.icon}</span><span><span class="ll-name">${band.name}</span><br><span class="ll-val">${band.value}${band.unit ? ' ' + band.unit : ''}</span></span>`;
        if (band.url) {
            lbl.setAttribute('data-url', band.url);
            lbl.addEventListener('click', () => window.open(band.url, '_blank'));
        }
        canvas.appendChild(lbl);
    });

    // ── Draw right flows ──
    tgtBands.forEach((band, i) => {
        if (band.h <= 0) return;
        const cSlot = cRightSlots[i];

        const grad = document.createElementNS(NS, 'linearGradient');
        grad.id = `rg${i}`;
        grad.setAttribute('x1', '0%'); grad.setAttribute('x2', '100%');
        const s1 = document.createElementNS(NS, 'stop');
        s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', band.color); s1.setAttribute('stop-opacity', '0.25');
        const s2 = document.createElementNS(NS, 'stop');
        s2.setAttribute('offset', '100%'); s2.setAttribute('stop-color', band.color); s2.setAttribute('stop-opacity', '0.65');
        grad.append(s1, s2); defs.appendChild(grad);

        const x0 = MID_X + MID_W;
        const x1 = RIGHT_X - 6;
        const cpx = x0 + (x1 - x0) * 0.5;

        const d = `
            M ${x0},${cSlot.y}
            C ${cpx},${cSlot.y} ${cpx},${band.y} ${x1},${band.y}
            L ${x1},${band.y + band.h}
            C ${cpx},${band.y + band.h} ${cpx},${cSlot.y + cSlot.h} ${x0},${cSlot.y + cSlot.h}
            Z`;
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', `url(#rg${i})`);
        svg.appendChild(path);

        const motionD = `M ${x0},${cSlot.y + cSlot.h / 2} C ${cpx},${cSlot.y + cSlot.h / 2} ${cpx},${band.y + band.h / 2} ${x1},${band.y + band.h / 2}`;
        addParticles(svg, defs, `rm${i}`, motionD, 3, band.color);

        const bar = document.createElement('div');
        bar.className = 'right-bar';
        bar.style.cssText = `left:${RIGHT_X}px;top:${band.y}px;height:${band.h}px;background:${band.color};`;
        canvas.appendChild(bar);

        const lbl = document.createElement('div');
        lbl.className = 'right-label';
        lbl.style.cssText = `left:${RIGHT_X + 18}px;top:${band.y + band.h / 2 - 22}px;`;
        lbl.innerHTML = `<span class="rl-name">${band.name}</span><br><span class="rl-inc" style="color:${band.color}">${band.incidents} incident${band.incidents !== 1 ? 's' : ''}</span><br><span class="rl-alerts">${band.alerts} alerts</span>`;
        canvas.appendChild(lbl);
    });
}

function addParticles(svg, defs, id, d, count, color) {
    const mp = document.createElementNS(NS, 'path');
    mp.setAttribute('d', d);
    mp.id = id;
    mp.setAttribute('fill', 'none');
    defs.appendChild(mp);

    for (let p = 0; p < count; p++) {
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('r', '2.5');
        c.setAttribute('fill', '#c8d6e5');
        c.setAttribute('opacity', '0');

        const dur = (3 + Math.random() * 2).toFixed(2);
        const begin = (p * (3 / count) + Math.random() * 0.5).toFixed(2);

        const am = document.createElementNS(NS, 'animateMotion');
        am.setAttribute('dur', dur + 's');
        am.setAttribute('repeatCount', 'indefinite');
        am.setAttribute('begin', begin + 's');
        const mpath = document.createElementNS(NS, 'mpath');
        mpath.setAttributeNS('http://www.w3.org/1999/xlink', 'href', `#${id}`);
        am.appendChild(mpath);
        c.appendChild(am);

        const ao = document.createElementNS(NS, 'animate');
        ao.setAttribute('attributeName', 'opacity');
        ao.setAttribute('values', '0;0.7;0.7;0');
        ao.setAttribute('keyTimes', '0;0.08;0.92;1');
        ao.setAttribute('dur', dur + 's');
        ao.setAttribute('repeatCount', 'indefinite');
        ao.setAttribute('begin', begin + 's');
        c.appendChild(ao);
        svg.appendChild(c);
    }
}

window.addEventListener('load', layout);
window.addEventListener('resize', layout);
requestAnimationFrame(layout);
</script>
