    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Loading overlay ── */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(13,17,23,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-shield {
            width: 80px; height: 84px;
            filter: drop-shadow(0 0 24px rgba(0,120,212,0.6));
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        .loading-text {
            font-size: 16px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 1px;
        }
        .loading-bar-track {
            width: 200px; height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        .loading-bar-fill {
            height: 100%; width: 30%;
            background: linear-gradient(90deg, #0078d4, #58c8ff);
            border-radius: 3px;
            animation: slide 1.2s ease-in-out infinite;
        }
        @keyframes slide {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(450%); }
        }

        /* ── Header ── */
        header {
            height: 72px;
            padding: 0 36px;
            display: flex;
            align-items: center;
            gap: 16px;
            background: #0d1117;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .header-shield { width: 48px; height: 50px; filter: drop-shadow(0 0 12px rgba(0,120,212,0.5)); }
        .header-title h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 0;
            margin: 0 auto;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 8px 4px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .stat-item {
            text-align: center;
            padding: 0 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .stat-item:last-child { border-right: none; }
        a.stat-item { text-decoration: none; color: inherit; }
        a.stat-item:hover { background: rgba(255,255,255,0.06); border-radius: 6px; }
        .stat-item .stat-val { font-size: 24px; font-weight: 700; }
        .stat-item .stat-val.blue { color: #58a6ff; }
        .stat-item .stat-val.green { color: #3fb950; }
        .stat-item .stat-val.orange { color: #d29922; }
        .stat-item .stat-label { font-size: 11px; color: #6b7b8d; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-arrow { color: #6b7b8d; font-size: 14px; padding: 0 4px; }

        .header-time {
            font-size: 13px;
            color: #c9d1d9;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 0;
            cursor: pointer;
            position: relative;
        }
        .header-time select {
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            border: none;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 13px;
            padding: 8px 32px 8px 14px;
            cursor: pointer;
            outline: none;
        }
        .header-time select option {
            background: #161b22;
            color: #c9d1d9;
        }
        .header-time::after {
            content: '▾';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #6b7b8d;
            font-size: 12px;
        }
        .header-workspace {
            font-size: 13px;
            color: #6b7b8d;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 8px 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }
        .header-workspace .ws-label { color: #8b949e; }
        .header-workspace .ws-name  { color: #c9d1d9; font-weight: 500; }
        .header-gear {
            position: relative;
            width: 32px; height: 32px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            display: flex; align-items: center; justify-content: center;
            color: #8b949e; cursor: pointer; font-size: 18px;
        }
        .gear-menu {
            display: none;
            position: absolute;
            top: 40px; right: 0;
            background: #161b22;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 12px 16px;
            min-width: 180px;
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .gear-menu.open { display: block; }
        .gear-menu label {
            display: block;
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .gear-menu select {
            width: 100%;
            background: rgba(255,255,255,0.06);
            color: #e6edf3;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 13px;
            cursor: pointer;
        }
        .refresh-indicator {
            font-size: 11px;
            color: #3fb950;
            margin-top: 8px;
            text-align: center;
        }

        /* ── Main canvas ── */
        .canvas-wrap {
            position: relative;
            height: calc(100vh - 72px);
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .canvas-wrap.visible {
            opacity: 1;
        }
        header {
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        header.visible {
            opacity: 1;
        }

        /* Annotation labels */
        .metrics-bar {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 28px;
            z-index: 10;
            background: rgba(13,17,23,0.85);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 8px 24px;
        }
        .metric-item {
            text-align: center;
            cursor: default;
            position: relative;
        }
        .metric-val { font-size: 15px; font-weight: 700; color: #c9d1d9; }
        .metric-label { font-size: 10px; color: #6b7b8d; text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-item .metric-tip {
            display: none;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1c2129;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 11px;
            color: #8b949e;
            white-space: nowrap;
            z-index: 20;
            margin-top: 6px;
        }
        .metric-item:hover .metric-tip { display: block; }

        /* Full-width SVG for sankey flows */
        #sankey {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* ── Left labels ── */
        .left-label {
            position: absolute;
            z-index: 10;
            text-align: right;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s ease;
        }
        .left-label:hover { transform: scale(1.08); }
        .left-label .ll-icon { font-size: 16px; }
        .left-label .ll-name { font-size: 15px; font-weight: 600; color: #c9d1d9; }
        .left-label .ll-val { font-size: 15px; font-weight: 400; color: #8b949e; }
        .left-label .ll-subs { font-size: 11px; color: #6b7b8d; display: flex; flex-direction: column; gap: 1px; margin-top: 2px; text-align: right; }
        .left-label .ll-sub { color: #6b7b8d; text-decoration: none; cursor: pointer; display: block; }
        .left-label .ll-sub:hover { color: #58a6ff; text-decoration: underline; }
        .left-label[data-url] { cursor: pointer; }
        .left-label[data-url]:hover .ll-name { color: #58a6ff; text-decoration: underline; }

        /* Left colored bars */
        .left-bar {
            position: absolute;
            z-index: 5;
            width: 5px;
            border-radius: 3px;
        }

        /* ── Right labels ── */
        .right-label {
            position: absolute;
            z-index: 10;
            text-align: left;
            transition: transform 0.2s ease;
        }
        .right-label:hover { transform: scale(1.08); }
        .right-label .rl-name { font-size: 15px; font-weight: 700; color: #c9d1d9; }
        .right-label .rl-inc { font-size: 14px; font-weight: 700; }
        .right-label .rl-alerts { font-size: 12px; color: #6b7b8d; }

        /* Right colored bars */
        .right-bar {
            position: absolute;
            z-index: 5;
            width: 5px;
            border-radius: 3px;
        }

        /* ── Center shield ── */
        .center-shield {
            position: absolute;
            z-index: 20;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            transition: transform 0.3s ease;
        }
        .center-shield:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }
        .shield-glow {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,120,212,0.35) 0%, rgba(0,180,255,0.12) 40%, transparent 70%);
            animation: shieldPulse 3s ease-in-out infinite;
        }
        @keyframes shieldPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.06); opacity: 0.75; }
        }
        .shield-svg {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            width: 120px; height: 126px;
            filter: drop-shadow(0 0 30px rgba(56,182,255,0.4));
        }
    </style>
</head>

// ── Fetch live data from backend API ──
function showLoading() {
    const o = document.getElementById('loading-overlay');
    if (o) o.classList.remove('hidden');
}
function hideLoading() {
    const o = document.getElementById('loading-overlay');
    if (o) o.classList.add('hidden');
}

async function fetchDashboard(timeframe, silent = false) {
    if (!silent) showLoading();
    let data;
    try {
        const res = await fetch(`/api/dashboard?timeframe=${timeframe}`);
        data = await res.json();
    } catch (err) {
        console.warn('API unreachable, showing zeros:', err.message);
        data = {
            sources: { cloudIdentities: 0, hybridIdentities: 0, onpremIdentities: 0, devices: 0, email: 0, cloudApps: 0, oauthApps: 0, sentinelGB: 0, aiAgents: 0 },
            header:  { totalAlerts: 0, totalIncidents: 0, openIncidents: 0, workspaceName: '' },
            stats:   { noiseReduction: 0, mttaMinutes: 0, mttrMinutes: 0 },
            incidents: {
                high: { incidents: 0, alerts: 0 }, medium: { incidents: 0, alerts: 0 },
                low: { incidents: 0, alerts: 0 }, informational: { incidents: 0, alerts: 0 },
            },
        };
    }

    // Update left-side sources
    sources[0].subs[0].value = data.sources.cloudIdentities;
    sources[0].subs[1].value = data.sources.hybridIdentities;
    sources[0].subs[2].value = data.sources.onpremIdentities;
    sources[0].value = data.sources.cloudIdentities + data.sources.hybridIdentities + data.sources.onpremIdentities;
    sources[1].value = data.sources.devices;
    sources[2].value = data.sources.email;
    sources[3].subs[0].value = data.sources.cloudApps;
    sources[3].subs[1].value = data.sources.oauthApps;
    sources[3].value = data.sources.cloudApps + data.sources.oauthApps;
    sources[4].value = data.sources.sentinelGB;
    sources[5].value = data.sources.aiAgents;

    // Update right-side severity targets
    targets[0].incidents = data.incidents.high.incidents;
    targets[0].alerts    = data.incidents.high.alerts;
    targets[1].incidents = data.incidents.medium.incidents;
    targets[1].alerts    = data.incidents.medium.alerts;
    targets[2].incidents = data.incidents.low.incidents;
    targets[2].alerts    = data.incidents.low.alerts;
    targets[3].incidents = data.incidents.informational.incidents;
    targets[3].alerts    = data.incidents.informational.alerts;

    // Update header stats
    document.querySelector('.stat-val.blue').textContent  = data.header.totalAlerts;
    document.querySelector('.stat-val.green').textContent  = data.header.totalIncidents;
    document.querySelector('.stat-val.orange').textContent = data.header.openIncidents;

    // Update workspace name
    const wsEl = document.getElementById('workspace-name');
    if (data.header.workspaceName) {
        document.getElementById('ws-name-text').textContent = data.header.workspaceName;
        wsEl.style.display = '';
    } else {
        wsEl.style.display = 'none';
    }

    // Update metrics bar
    document.getElementById('m-noise').textContent = data.stats.noiseReduction + '%';
    const mtta = data.stats.mttaMinutes;
    const mttr = data.stats.mttrMinutes;
    document.getElementById('m-mtta').textContent = mtta >= 60 ? (mtta / 60).toFixed(1).replace(/\.0$/, '') + 'h' : Math.round(mtta) + ' min';
    document.getElementById('m-mttr').textContent = mttr >= 60 ? (mttr / 60).toFixed(1).replace(/\.0$/, '') + 'h' : Math.round(mttr) + ' min';

    // Hide loading overlay and reveal dashboard
    if (!silent) {
        hideLoading();
        document.querySelector('header').classList.add('visible');
        document.getElementById('canvas').classList.add('visible');
    }

    layout();
}

function startAutoRefresh() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    const seconds = parseInt(refreshSelect.value);
    if (seconds === 0) {
        refreshIndicator.textContent = '⟳ Auto refresh: Off';
        return;
    }
    const label = seconds < 60 ? seconds + ' sec' : (seconds / 60) + ' min';
    refreshIndicator.textContent = '⟳ Auto refresh: ' + label;
    autoRefreshTimer = setInterval(() => {
        fetchDashboard(document.getElementById('timeframe').value, true);
    }, seconds * 1000);
}

const NS = 'http://www.w3.org/2000/svg';
const canvas = document.getElementById('canvas');
const svg    = document.getElementById('sankey');

function fmtNum(v, unit) {
    if (unit === 'GB') {
        if (v >= 1024 * 1024) return (v / (1024 * 1024)).toFixed(1).replace(/\.0$/, '') + ' PB';
        if (v >= 1024) return (v / 1024).toFixed(1).replace(/\.0$/, '') + ' TB';
        return v + ' GB';
    }
    if (v >= 1000000) return (v / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (v >= 1000) return (v / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
    return '' + v;
}

function layout() {
    const W = canvas.clientWidth;
    const H = canvas.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.innerHTML = '';

    // Remove old overlays
    canvas.querySelectorAll('.left-label,.left-bar,.right-label,.right-bar').forEach(e => e.remove());

    const LEFT_X = 230;
    const RIGHT_X = W - 230;
    const MID_X  = W / 2;
    const MID_W  = 110;

    const PAD_TOP = 60;
    const PAD_BOT = 30;
    const usableH = H - PAD_TOP - PAD_BOT;
    const GAP_SRC = 14;
    const GAP_TGT = 34;
    const MIN_BAND_H = 40;

    // ── Source bands (left) — reserve min height, distribute remainder proportionally ──
    const activeSrc = sources.filter(s => s.value > 0 || s.subs);
    const minReservedSrc = sources.length * MIN_BAND_H;
    const gapTotalSrc = GAP_SRC * Math.max(sources.length - 1, 0);
    const remainSrc = Math.max(usableH - gapTotalSrc - minReservedSrc, 0);
    const totalSrcVal = sources.reduce((s, d) => s + d.value, 0) || 1;
    const srcExtraScale = remainSrc / totalSrcVal;

    let srcBands = [];
    let sy = PAD_TOP;
    for (const s of sources) {
        const h = MIN_BAND_H + (s.value > 0 ? s.value * srcExtraScale : 0);
        srcBands.push({ ...s, y: sy, h });
        if (h > 0) sy += h + GAP_SRC;
    }

    // ── Target bands (right) — same approach ──
    const minReservedTgt = targets.length * MIN_BAND_H;
    const gapTotalTgt = GAP_TGT * Math.max(targets.length - 1, 0);
    const remainTgt = Math.max(usableH - gapTotalTgt - minReservedTgt, 0);
    const totalTgtVal = targets.reduce((s, d) => s + d.alerts, 0) || 1;
    const tgtExtraScale = remainTgt / totalTgtVal;

    let tgtBands = [];
    let ty = PAD_TOP;
    for (const t of targets) {
        const h = MIN_BAND_H + (t.alerts > 0 ? t.alerts * tgtExtraScale : 0);
        tgtBands.push({ ...t, y: ty, h });
        ty += h + GAP_TGT;
    }

    const centerTop = H / 2 - 100;
    const centerBotFull = H / 2 + 100;
    const cTotalH = centerBotFull - centerTop;

    const defs = document.createElementNS(NS, 'defs');
    svg.appendChild(defs);

    let cLeftY = centerTop;
    const minCSlotH = 5;
    const totalMinC = srcBands.length * minCSlotH;
    const remainCLeft = Math.max(cTotalH - totalMinC, 0);
    const cLeftSlots = srcBands.map(b => {
        const ch = minCSlotH + (totalSrcVal > 0 ? (b.value / totalSrcVal) * remainCLeft : 0);
        const slot = { y: cLeftY, h: ch };
        cLeftY += ch;
        return slot;
    });

    let cRightY = centerTop;
    const totalMinCRight = tgtBands.length * minCSlotH;
    const remainCRight = Math.max(cTotalH - totalMinCRight, 0);
    const cRightSlots = tgtBands.map(b => {
        const ch = minCSlotH + (totalTgtVal > 0 ? (b.alerts / totalTgtVal) * remainCRight : 0);
        const slot = { y: cRightY, h: ch };
        cRightY += ch;
        return slot;
    });

    // ── Draw left flows ──
    srcBands.forEach((band, i) => {
        const cSlot = cLeftSlots[i];

        const grad = document.createElementNS(NS, 'linearGradient');
        grad.id = `lg${i}`;
        grad.setAttribute('x1', '0%'); grad.setAttribute('x2', '100%');
        const s1 = document.createElementNS(NS, 'stop');
        s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', band.color); s1.setAttribute('stop-opacity', '0.75');
        const s2 = document.createElementNS(NS, 'stop');
        s2.setAttribute('offset', '100%'); s2.setAttribute('stop-color', band.color); s2.setAttribute('stop-opacity', '0.25');
        grad.append(s1, s2); defs.appendChild(grad);

        const x0 = LEFT_X + 6;
        const x1 = MID_X - MID_W;
        const cpx = x0 + (x1 - x0) * 0.5;

        const d = `
            M ${x0},${band.y}
            C ${cpx},${band.y} ${cpx},${cSlot.y} ${x1},${cSlot.y}
            L ${x1},${cSlot.y + cSlot.h}
            C ${cpx},${cSlot.y + cSlot.h} ${cpx},${band.y + band.h} ${x0},${band.y + band.h}
            Z`;
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', `url(#lg${i})`);
        svg.appendChild(path);

        const motionD = `M ${x0},${band.y + band.h / 2} C ${cpx},${band.y + band.h / 2} ${cpx},${cSlot.y + cSlot.h / 2} ${x1},${cSlot.y + cSlot.h / 2}`;
        // Particle count proportional to value: min 3, max 15
        const maxSrcVal = Math.max(...srcBands.filter(b => b.h > 0).map(b => b.value), 1);
        const pCount = Math.max(3, Math.min(15, Math.round((band.value / maxSrcVal) * 15)));
        addParticles(svg, defs, `lm${i}`, x0, band.y, band.h, x1, cSlot.y, cSlot.h, cpx, pCount);

        const bar = document.createElement('div');
        bar.className = 'left-bar';
        bar.style.cssText = `left:${LEFT_X}px;top:${band.y}px;height:${band.h}px;background:${band.color};`;
        canvas.appendChild(bar);

        const lbl = document.createElement('div');
        lbl.className = 'left-label';
        if (band.subs) {
            lbl.style.cssText = `right:${W - LEFT_X + 12}px;top:${band.y + band.h / 2 - 32}px;`;
            const subsHtml = band.subs.map(s =>
                `<a href="${s.url}" target="_blank" class="ll-sub">${s.name}: ${fmtNum(s.value)}</a>`
            ).join('');
            lbl.innerHTML = `<span class="ll-icon">${band.icon}</span><span><a href="${band.url}" target="_blank" class="ll-name" style="text-decoration:none;color:inherit;">${band.name}</a> <span class="ll-val">${fmtNum(band.value)}</span><div class="ll-subs">${subsHtml}</div></span>`;
        } else {
            lbl.style.cssText = `right:${W - LEFT_X + 12}px;top:${band.y + band.h / 2 - 18}px;`;
            lbl.innerHTML = `<span class="ll-icon">${band.icon}</span><span><span class="ll-name">${band.name}</span><br><span class="ll-val">${fmtNum(band.value, band.unit)}</span></span>`;
        }
        if (band.url && !band.subs) {
            lbl.setAttribute('data-url', band.url);
            lbl.addEventListener('click', () => window.open(band.url, '_blank'));
        }
        canvas.appendChild(lbl);
    });

    // ── Draw right flows ──
    tgtBands.forEach((band, i) => {
        const cSlot = cRightSlots[i];

        const grad = document.createElementNS(NS, 'linearGradient');
        grad.id = `rg${i}`;
        grad.setAttribute('x1', '0%'); grad.setAttribute('x2', '100%');
        const s1 = document.createElementNS(NS, 'stop');
        s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', band.color); s1.setAttribute('stop-opacity', '0.25');
        const s2 = document.createElementNS(NS, 'stop');
        s2.setAttribute('offset', '100%'); s2.setAttribute('stop-color', band.color); s2.setAttribute('stop-opacity', '0.65');
        grad.append(s1, s2); defs.appendChild(grad);

        const x0 = MID_X + MID_W;
        const x1 = RIGHT_X - 6;
        const cpx = x0 + (x1 - x0) * 0.5;

        const d = `
            M ${x0},${cSlot.y}
            C ${cpx},${cSlot.y} ${cpx},${band.y} ${x1},${band.y}
            L ${x1},${band.y + band.h}
            C ${cpx},${band.y + band.h} ${cpx},${cSlot.y + cSlot.h} ${x0},${cSlot.y + cSlot.h}
            Z`;
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', `url(#rg${i})`);
        svg.appendChild(path);

        const motionD = `M ${x0},${cSlot.y + cSlot.h / 2} C ${cpx},${cSlot.y + cSlot.h / 2} ${cpx},${band.y + band.h / 2} ${x1},${band.y + band.h / 2}`;
        addParticles(svg, defs, `rm${i}`, x0, cSlot.y, cSlot.h, x1, band.y, band.h, cpx, 3);

        const bar = document.createElement('div');
        bar.className = 'right-bar';
        bar.style.cssText = `left:${RIGHT_X}px;top:${band.y}px;height:${band.h}px;background:${band.color};`;
        canvas.appendChild(bar);

        const lbl = document.createElement('div');
        lbl.className = 'right-label';
        lbl.style.cssText = `left:${RIGHT_X + 18}px;top:${band.y + band.h / 2 - 22}px;`;
        lbl.innerHTML = `<span class="rl-name">${band.name}</span><br><span class="rl-inc" style="color:${band.color}">${fmtNum(band.incidents)} incident${band.incidents !== 1 ? 's' : ''}</span><br><span class="rl-alerts">${fmtNum(band.alerts)} alerts</span>`;
        canvas.appendChild(lbl);
    });
}

function addParticles(svg, defs, id, x0, y0, h0, x1, y1, h1, cpx, count) {
    for (let p = 0; p < count; p++) {
        // Random position within band: 0=top edge, 1=bottom edge
        const t = 0.15 + Math.random() * 0.7; // keep 15% margin from edges

        // Interpolate Y offset at start (wider) and end (narrower)
        const startY = y0 + h0 * t;
        const endY   = y1 + h1 * t;

        const motionD = `M ${x0},${startY} C ${cpx},${startY} ${cpx},${endY} ${x1},${endY}`;

        const mp = document.createElementNS(NS, 'path');
        const pid = `${id}_${p}`;
        mp.setAttribute('d', motionD);
        mp.id = pid;
        mp.setAttribute('fill', 'none');
        defs.appendChild(mp);

        const c = document.createElementNS(NS, 'circle');
        const r = (1.5 + Math.random() * 1.5).toFixed(1);
        c.setAttribute('r', r);
        c.setAttribute('fill', '#c8d6e5');
        c.setAttribute('opacity', '0');

        const dur = (2 + Math.random() * 4).toFixed(2);
        const begin = (Math.random() * 6).toFixed(2);

        const am = document.createElementNS(NS, 'animateMotion');
        am.setAttribute('dur', dur + 's');
        am.setAttribute('repeatCount', 'indefinite');
        am.setAttribute('begin', begin + 's');
        const mpath = document.createElementNS(NS, 'mpath');
        mpath.setAttributeNS('http://www.w3.org/1999/xlink', 'href', `#${pid}`);
        am.appendChild(mpath);
        c.appendChild(am);

        const ao = document.createElementNS(NS, 'animate');
        ao.setAttribute('attributeName', 'opacity');
        ao.setAttribute('values', '0;0.8;0.6;0.8;0');
        ao.setAttribute('keyTimes', '0;0.15;0.5;0.85;1');
        ao.setAttribute('dur', dur + 's');
        ao.setAttribute('repeatCount', 'indefinite');
        ao.setAttribute('begin', begin + 's');
        c.appendChild(ao);
        svg.appendChild(c);
    }
}

window.addEventListener('load', layout);
window.addEventListener('resize', layout);
requestAnimationFrame(layout);
</script>
</body>
</html>
